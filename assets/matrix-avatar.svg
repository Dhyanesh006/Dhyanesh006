<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Animated terminal avatar with D V monogram">
  <defs>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cur { animation: blink 1s steps(1, end) infinite; }
      @keyframes glow-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      .pulse { animation: glow-pulse 2.6s ease-in-out infinite; }
      @keyframes sweep { from { transform: translateY(-140px); } to { transform: translateY(140px); } }
      .sweep { animation: sweep 4.5s linear infinite; }
    </style>
    <linearGradient id="av-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00420f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="134" height="134" rx="14" fill="#000000"/>
  <rect x="3" y="3" width="134" height="134" rx="14" fill="none" stroke="url(#av-border)" stroke-width="3"/>

  <rect x="3" y="3" width="134" height="12" rx="6" fill="#00ff41" opacity="0.08" class="sweep"/>

  <g transform="translate(70 62)" text-anchor="middle" font-family="'Courier New', Consolas, monospace">
    <text x="0" y="0" class="pulse" font-size="40" font-weight="bold" fill="#00ff41">
      <tspan fill="#00ff41">D</tspan><tspan fill="#00e640">V</tspan>
    </text>
    <text x="0" y="26" font-size="11" letter-spacing="4" fill="#006b2e">Dhyanesh</text>
    <text x="0" y="42" font-size="10" letter-spacing="2" fill="#00420f">est. 2024</text>
  </g>

  <text x="70" y="120" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#00a32a">
    <tspan fill="#00ff41">$</tspan> whoami <tspan fill="#00ff41" class="cur">&#9608;</tspan>
  </text>
</svg>
