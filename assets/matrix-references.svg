<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="230" viewBox="0 0 1200 230" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Matrix terminal with references">
  <defs>
    
    <filter id="ref-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ref-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00420f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00a32a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00420f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="230" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="16" fill="#00ff41" opacity="0.05">
    <animate attributeName="y" from="-16" to="230" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g filter="url(#ref-glow)" transform="translate(70 36)" font-family="'Courier New', Consolas, monospace">
    <text x="0" y="0" font-size="21" opacity="1">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.4s" repeatCount="1" fill="freeze"/>
      
      <tspan fill="#00ff41">$</tspan> <tspan fill="#00e640">man matrix-readme</tspan>
    </text>
    <text x="0" y="33" font-size="21" opacity="1">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1s" repeatCount="1" fill="freeze"/>
      
      <tspan fill="#00a32a">[ INFO ]</tspan> <tspan fill="#8fbf98">every banner, divider, terminal, card &amp; badge</tspan>
    </text>
    <text x="0" y="62" font-size="21" opacity="1">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.6s" repeatCount="1" fill="freeze"/>
      
      <tspan fill="#00a32a">[ INFO ]</tspan> <tspan fill="#8fbf98">is a hand-built animated SVG living in /assets</tspan>
    </text>
    <text x="0" y="91" font-size="21" opacity="1">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.2s" repeatCount="1" fill="freeze"/>
      
      <tspan fill="#00a32a">[ INFO ]</tspan> <tspan fill="#8fbf98">pure SVG + SMIL · zero JavaScript · zero external services</tspan>
    </text>
    <text x="0" y="124" font-size="21" opacity="1">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.8s" repeatCount="1" fill="freeze"/>
      
      <tspan fill="#00ff41">$</tspan> <tspan fill="#00e640">echo "daily refresh by GitHub Actions"</tspan>
      <tspan fill="#00ff41">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="infinite" fill="remove"/>
      &#9608;</tspan>
    </text>
  </g>

  <line x1="160" y1="178" x2="1040" y2="178" stroke="url(#ref-line)" stroke-width="1.5" opacity="0.8"/>
  <text x="600" y="216" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" letter-spacing="12" fill="#00a32a">
    <tspan fill="#00ff41">MATRIX</tspan> <tspan fill="#006b2e">//</tspan> <tspan fill="#00a32a">REFERENCES</tspan>
  </text>
</svg>
