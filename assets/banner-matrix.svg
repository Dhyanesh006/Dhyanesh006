    <text x="18" y="300" fill="#006b2e">&gt; status: ALIVE <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></text>
    <text x="1060" y="24" text-anchor="end">&gt; node: MATRIX-01</text>
    <text x="1060" y="300" text-anchor="end" fill="#006b2e">&gt; kernel: linux --matrix</text>
  </g>

  <!-- ══════════ TITLE ══════════ -->
