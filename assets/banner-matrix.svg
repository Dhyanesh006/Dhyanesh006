  </rect>

  <!-- ══════════ BOTTOM STATUS BAR ══════════ -->
  <g font-family="monospace" font-size="12">
    <rect x="0" y="308" width="1200" height="12" fill="#001407"/>
    <text x="18" y="317" fill="#00a32a">&gt;_ follow_the_white_rabbit</text>
