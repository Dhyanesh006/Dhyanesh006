<svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44" role="img" aria-label="Portfolio">
  <defs>
    <style>
      @keyframes scan { from { transform: translateY(-6px); } to { transform: translateY(44px); } }
      .scanline { animation: scan 3.2s linear infinite; }
    </style>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00140a"/>
      <stop offset="100%" stop-color="#003d1a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="198" height="42" rx="7" fill="url(#pb)" stroke="#00ff41" stroke-width="1.6"/>
  <rect x="0" y="0" width="200" height="8" fill="#00ff41" opacity="0.12" class="scanline"/>
  <text x="100" y="28" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="bold" fill="#00ff41" letter-spacing="3">PORTFOLIO</text>
</svg>
