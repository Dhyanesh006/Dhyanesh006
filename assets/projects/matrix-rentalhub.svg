<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-label="Featured project card — RentalHub">
  <defs>
    
    <filter id="pc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="pc-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00420f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="516" height="246" rx="12" fill="#00140a"/>
  <rect x="2" y="2" width="516" height="246" rx="12" fill="none" stroke="url(#pc-border)" stroke-width="2"/>

  <rect x="0" y="0" width="520" height="16" fill="#00ff41" opacity="0.05">
      
        <animateTransform attributeName="transform" type="translate" values="0 -8;0 246" dur="4s" repeatCount="infinite" fill="remove"/>
      
    </rect>

  <g transform="translate(20 22)" font-family="'Courier New', Consolas, monospace">
    <rect x="0" y="0" width="480" height="30" rx="6" fill="#00420f" opacity="0.45"/>
    <circle cx="14" cy="15" r="5" fill="#00a32a" opacity="0.7"/>
    <circle cx="30" cy="15" r="5" fill="#00a32a" opacity="0.5"/>
    <circle cx="46" cy="15" r="5" fill="#00a32a" opacity="0.3"/>
    <text x="62" y="20" font-size="14" fill="#00e640" letter-spacing="2">root@matrix:~/projects</text>
  </g>

  <g transform="translate(20 76)" filter="url(#pc-glow)" font-family="'Courier New', Consolas, monospace">
    <text x="0" y="0" font-size="22">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.4s" repeatCount="1" fill="freeze"/>
      
      <tspan fill="#00ff41">&#9733;</tspan> <tspan fill="#d4fdd9">RentalHub</tspan> <tspan fill="#006b2e" font-size="15">// private repo</tspan>
    </text>
    <text x="0" y="32" font-size="16" fill="#00e640">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1s" repeatCount="1" fill="freeze"/>
      rental hub &amp; marketplace —</text>
    <text x="0" y="56" font-size="16" fill="#8fbf98">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.6s" repeatCount="1" fill="freeze"/>
      find, list &amp; manage rentals on a</text>
    <text x="0" y="80" font-size="16" fill="#8fbf98">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.2s" repeatCount="1" fill="freeze"/>
      full MERN stack backend.</text>
    <text x="0" y="116" font-size="15">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.8s" repeatCount="1" fill="freeze"/>
      
      <tspan fill="#006b2e">[ stack ]</tspan> <tspan fill="#00a32a">mongo db</tspan> <tspan fill="#006b2e">·</tspan> <tspan fill="#00a32a">express</tspan> <tspan fill="#006b2e">·</tspan> <tspan fill="#00a32a">react</tspan> <tspan fill="#006b2e">·</tspan> <tspan fill="#00a32a">node</tspan>
      <tspan fill="#00ff41">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="infinite" fill="remove"/>
      &#9608;</tspan>
    </text>
  </g>

  <text x="20" y="228" font-family="'Courier New', Consolas, monospace" font-size="14">
    <tspan fill="#00ff41">$</tspan> <tspan fill="#00a32a">git clone</tspan> <tspan fill="#d4fdd9">
        <animate attributeName="opacity" values="1;0.35;0.85" dur="2s" repeatCount="infinite" fill="remove"/>
      Dhyanesh006/rentalhub</tspan>
  </text>
</svg>
