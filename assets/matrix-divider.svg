<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 72" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated Matrix neon divider">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="line-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00420f" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00a32a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#00a32a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00420f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#neon-glow)">
    <line x1="24" y1="36" x2="1176" y2="36" stroke="url(#line-fade)" stroke-width="2" opacity="0.55"/>

    <line x1="24" y1="36" x2="548" y2="36" stroke="#00ff41" stroke-width="2" stroke-dasharray="4 16" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="1176" y1="36" x2="652" y2="36" stroke="#00ff41" stroke-width="2" stroke-dasharray="4 16" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="3.2s" repeatCount="indefinite"/>
    </line>

    <line x1="24" y1="36" x2="540" y2="36" stroke="#d4fdd9" stroke-width="1.2" stroke-dasharray="2 10" opacity="0.35">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.1s" repeatCount="indefinite"/>
    </line>
    <line x1="1176" y1="36" x2="660" y2="36" stroke="#d4fdd9" stroke-width="1.2" stroke-dasharray="2 10" opacity="0.35">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <g transform="translate(600 36)">
    <circle r="24" fill="none" stroke="#00a32a" stroke-width="1.5" stroke-dasharray="8 10" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>
    <polygon points="0,-13 13,0 0,13 -13,0" fill="#00ff41" filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="scale" values="1;1.22;1" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </polygon>
    <text y="-34" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" letter-spacing="6" fill="#00a32a">
      <tspan fill="#00ff41">M A T R I X</tspan>
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <g stroke="#00a32a" stroke-width="2" opacity="0.7">
    <line x1="24" y1="28" x2="24" y2="44"/>
    <line x1="1176" y1="28" x2="1176" y2="44"/>
  </g>
</svg>
