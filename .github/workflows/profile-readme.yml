# ═══════════════════════════════════════════════════════════════════
#  PROFILE README AUTO-UPDATE
#  ----------------------------------------------------------------
#  Keeps the profile README alive every day in a single run:
#  • refreshes the daily motivation quote (.github/scripts/update-quote.mjs)
#  • regenerates the animated Matrix stats cards via the GitHub API
#    (.github/scripts/generate-stats.mjs → profile/stats.svg +
#    profile/activity.svg)
#  • rebuilds the stacked showcase that writes every section into one
#    tall SVG, top to bottom, ending with the Pac-Man graph
#    (.github/scripts/build-showcase.mjs → profile/showcase.svg)
#  Everything is committed in one push, so the old separate quote and
#  timestamp workflows are replaced (no more README write races).
#  • Runs automatically every day at 00:30 UTC (staggered from pacman)
#  • Also runs manually from the Actions tab
#  • Latest maintained actions only
# ═══════════════════════════════════════════════════════════════════
name: Update Profile README

on:
  schedule:
    - cron: "30 0 * * *" # daily at 00:30 UTC (00:00 IST)
  workflow_dispatch: # manual trigger from the Actions tab

concurrency:
  group: profile-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Refresh today's motivation quote
        run: node .github/scripts/update-quote.mjs

      # ── Animated Matrix stats cards → profile/*.svg (showcase sources) ──
      - name: Generate animated Matrix stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-stats.mjs

      # ── Stacked showcase: every section in reading order, Pac-Man last ──
      - name: Fetch latest Pac-Man graph
        continue-on-error: true
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Dhyanesh006/Dhyanesh006/output/pacman-contribution-graph-dark.svg" \
            -o "$RUNNER_TEMP/pacman-dark.svg"

      - name: Build stacked showcase
        env:
          PACMAN_SVG: ${{ runner.temp }}/pacman-dark.svg
        run: node .github/scripts/build-showcase.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile
          git commit -m "chore: refresh profile README and stats" || exit 0
          git push
