# ═══════════════════════════════════════════════════════════════════
#  UPDATE README (LAST SYNC STAMP)
#  ----------------------------------------------------------------
#  Refreshes the "Last updated" timestamp in README.md every day
#  using .github/scripts/update-last-updated.mjs, then commits.
#  • Runs automatically every day at 06:00 UTC (staggered from the
#    pacman 00:00, stats 00:30 and quote 18:30 runs to avoid races)
#  • Also runs manually from the Actions tab
# ═══════════════════════════════════════════════════════════════════
name: Update README (Last Sync)

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC = 11:30 IST
  workflow_dispatch: # manual trigger from the Actions tab

concurrency:
  group: readme-timestamp
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Refresh the last-sync timestamp in README.md
        run: node .github/scripts/update-last-updated.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh last-sync timestamp" || exit 0
          git push
