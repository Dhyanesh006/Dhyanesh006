# ═══════════════════════════════════════════════════════════════════
#  PAC-MAN CONTRIBUTION ANIMATION
#  ----------------------------------------------------------------
#  • Generates an animated Pac-Man SVG from your GitHub contribution
#    graph using abozanona/pacman-contribution-graph (latest maintained)
#  • Runs automatically every day at 00:00 UTC
#  • Also runs on every push to `main` and on manual dispatch
#  • Pushes the generated SVGs to the `output` branch, which the
#    profile README embeds via raw.githubusercontent.com
#  • NO snake, NO deprecated actions
# ═══════════════════════════════════════════════════════════════════
name: Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch: # manual trigger from the Actions tab
  push:
    branches:
      - main # runs once on first push so it works immediately

concurrency:
  group: pacman-graph
  cancel-in-progress: true

permissions:
  contents: write # required to push to the `output` branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Step 1: generate the animated Pac-Man SVG into ./dist ──
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }} # uses YOUR username automatically
          github_token: ${{ secrets.GITHUB_TOKEN }} # default; kept explicit for clarity
          games: pacman # pacman | breakout | galaga | bomberman | ...
          player_style: opportunistic # opportunistic | aggressive | conservative

      # ── Step 2: publish ./dist to the `output` branch ──
      - name: Push generated SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
