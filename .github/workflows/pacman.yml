name: Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch: # manual trigger from the Actions tab
  push:
    branches:
      - main # generate on every push to keep the graph fresh

concurrency:
  group: pacman-graph
  cancel-in-progress: true

permissions:
  contents: write # required to publish to the `output` branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Dhyanesh006
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman # pacman | breakout | galaga | bomberman | ...
          player_style: opportunistic # opportunistic | aggressive | conservative

      - name: Publish generated SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
