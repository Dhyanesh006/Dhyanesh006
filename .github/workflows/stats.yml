# ═══════════════════════════════════════════════════════════════════
#  GITHUB STATS CARDS (STATS + SUMMARY CARDS)
#  ----------------------------------------------------------------
#  The hosted github-readme-stats / summary-cards Vercel instances are
#  no longer reliable, so these cards are generated by GitHub Actions
#  (the officially recommended approach) and committed straight into
#  this repository. The README embeds them as local files.
#  • Runs automatically every day at 00:30 UTC
#  • Also runs manually from the Actions tab
#  • Uses latest maintained actions only
# ═══════════════════════════════════════════════════════════════════
name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "30 0 * * *" # daily at 00:30 UTC (staggered from pacman run)
  workflow_dispatch: # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # ── Step 1: GitHub stats card → profile/github-stats.svg ──
      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&rank_icon=github&bg_color=000000&title_color=00ff41&text_color=00e640&icon_color=00ff41&border_color=00a32a
          path: profile/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Top languages card → profile/top-langs.svg ──
      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=000000&title_color=00ff41&text_color=00e640&icon_color=00ff41&border_color=00a32a
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 3: GitHub Profile Summary Cards → profile-summary-card-output/ ──
      # NOTE: For full private contribution data (Productive Time card),
      # create a Personal Access Token with `repo` scope, save it as the
      # secret `SUMMARY_GITHUB_TOKEN`, and use it below instead of GITHUB_TOKEN.
      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: "5.5"
          EXCLUDE: ""
          AUTO_PUSH: "false"
          THEME: "github_dark"
          ANIMATION: ""

      # ── Step 4: Commit everything in one single push ──
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile profile-summary-card-output
          git commit -m "chore: update GitHub stats cards" || exit 0
          git push
