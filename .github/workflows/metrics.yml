# ═══════════════════════════════════════════════════════════════════
#  GITHUB METRICS (ADVANCED, DARK MATRIX)
#  ----------------------------------------------------------------
#  Renders an advanced metrics card with lowlighter/metrics using the
#  built-in `terminal` template (an SSH-session mockup) recolored to the
#  Matrix palette (black background + neon greens) via `extras_css`, and
#  commits it to profile/metrics.svg (embedded in the README).
# • Runs automatically every day at 00:45 UTC (staggered from pacman
#    and the profile-readme runs)
# • Also runs on every push to main so the card is always fresh
# • Also runs manually from the Actions tab
#  • Uses the latest lowlighter/metrics release (no deprecated plugins)
#  • NOTE: some advanced plugins (achievements) benefit from a Personal
#    Access Token with `public_repo` scope. Save it as the secret
#    `METRICS_TOKEN` and it will be used automatically; otherwise the
#    workflow falls back to the scoped GITHUB_TOKEN.
# ═══════════════════════════════════════════════════════════════════
name: Generate GitHub Metrics

on:
  schedule:
    - cron: "45 0 * * *" # daily at 00:45 UTC
  push:
    branches:
      - main # generate the card on every push to main
  workflow_dispatch: # manual trigger from the Actions tab

concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Generate advanced metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          template: terminal # SSH-session mockup — recolored to Matrix below
          extras_css: |
            svg { color: #00ff41 !important; }
            .header { background: linear-gradient(#003818 0%, #00180b 100%) !important; }
            .title { color: #d4fdd9 !important; }
            .button { background: linear-gradient(#006b2e 0%, #003c1a 100%) !important; color: #d4fdd9 !important; }
            .button.exit { background: linear-gradient(#ff2d00 0%, #b80000 100%) !important; }
            pre { background: #000000 !important; }
            pre, .banner, footer { color: #00ff41 !important; }
            .banner { color: #00ff41 !important; }
            footer { color: #8fbf98 !important; }
            .warnings { color: #d4fdd9 !important; }
            .ps1-path { color: #00ff41 !important; }
            .ps1-location { color: #00e640 !important; }
            .diff { color: #00e640 !important; }
            .error { color: #ff5555 !important; }
            a { color: #00ff41 !important; }
            .isocalendar svg { filter: none !important; }
            :root {
              --color-calendar-graph-day-bg: #003c1a;
              --color-calendar-graph-day-L1-bg: #006b2e;
              --color-calendar-graph-day-L2-bg: #00a32a;
              --color-calendar-graph-day-L3-bg: #00e640;
              --color-calendar-graph-day-L4-bg: #00ff41;
            }
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_output: svg
          config_twemoji: yes

          # ── Languages ──
          plugin_languages: yes
          plugin_languages_details: percentage, bytes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_load: 500
          plugin_languages_sections: most-used
          plugin_languages_indepth: disabled
          plugin_languages_limit: 8

          # ── Contribution calendar ──
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ── Lines of code changed ──
          plugin_lines: yes

          # ── Gists ──
          plugin_gists: yes

          filename: profile/metrics.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/metrics.svg
          git commit -m "chore: update GitHub metrics card" || exit 0
          git push
