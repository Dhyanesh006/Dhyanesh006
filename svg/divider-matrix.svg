<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="Animated Matrix divider">
  <defs>
    <filter id="lineglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="70" fill="#000000"/>

  <!-- animated dashes line -->
  <line x1="30" y1="35" x2="1170" y2="35" stroke="#00a32a" stroke-width="2" stroke-dasharray="14 10" opacity="0.7" filter="url(#lineglow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <!-- head / tail chevrons -->
  <g font-family="monospace" fill="#00ff41" font-size="18">
    <text x="18" y="40">&lt;&lt;</text>
    <text x="1164" y="40" text-anchor="end">&gt;&gt;</text>
  </g>

  <!-- center label -->
  <g font-family="monospace">
    <text x="600" y="40" text-anchor="middle" font-size="16" fill="#00e640" letter-spacing="6">
      M A T R I X
      <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="58" text-anchor="middle" font-size="11" fill="#006b2e" letter-spacing="2">
      ▚▞ S E C T O R ▞▚
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
