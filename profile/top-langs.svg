
      <svg
        width="300"
        height="140"
        viewBox="0 0 300 140"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId"></title>
        <desc id="descId"></desc>
        

        

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#00a32a"
          width="299"
          fill="#000000"
          stroke-opacity="0"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
       
        data-testid="header"
      >
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" repeatCount="1" fill="freeze"/>
      Most Used Languages</text>
    </g>
      </g>
    

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg data-testid="lang-items" x="25">
      
  
      <mask id="rect-mask">
          <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
        </mask>
        
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="0"
          y="0"
          width="228.18"
          height="8"
          fill="#3178c6"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="228.18"
          y="0"
          width="20.63"
          height="8"
          fill="#663399"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="248.81"
          y="0"
          width="11.19"
          height="8"
          fill="#f1e05a"
        />
      
      
    <g transform="translate(0, 25)">
      <g transform="translate(0, 0)"><g transform="translate(0, 0)">
    <g style="animation-delay: 450ms">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" repeatCount="1" fill="freeze"/>
      
      <circle cx="5" cy="6" r="5" fill="#3178c6" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        TypeScript 91.27%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g style="animation-delay: 600ms">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" repeatCount="1" fill="freeze"/>
      
      <circle cx="5" cy="6" r="5" fill="#663399" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        CSS 8.25%
      </text>
    </g>
  </g></g><g transform="translate(150, 0)"><g transform="translate(0, 0)">
    <g style="animation-delay: 450ms">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" repeatCount="1" fill="freeze"/>
      
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        JavaScript 0.48%
      </text>
    </g>
  </g></g>
    </g>
  
    </svg>
  
        </g>
      </svg>
    